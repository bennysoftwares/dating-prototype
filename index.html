    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F3EC" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="TurtleDoves: a warm, relationship-focused dating app for people looking for something real." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TurtleDoves" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TurtleDoves</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var raw = localStorage.getItem('dp:theme');
          var pref = raw ? JSON.parse(raw).data : 'system';
          var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && dark) meta.setAttribute('content', '#1A1412');
        } catch (e) {}
      })();
    </script>
    <style>
      /*
       * Splash. Inlined so it paints before any JavaScript or CSS loads; the in-app <Splash />
       * (src/screens/system/SessionGate.tsx) renders the same markup, so there is no jump.
       * Sized from the viewport (width and height), centred inside the safe areas.
       */
      html, body { margin: 0; background: #f8f3ec; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #1a1412; }
      .splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        background:
          radial-gradient(110% 60% at 100% 0%, rgba(232, 168, 160, 0.55), rgba(232, 168, 160, 0) 62%),
          radial-gradient(120% 60% at 0% 100%, rgba(238, 160, 136, 0.5), rgba(238, 160, 136, 0) 64%),
          #f9efe4;
        color: #201916;
        --logo-gap: #f9efe4;
      }
      html[data-theme='dark'] .splash {
        background:
          radial-gradient(110% 60% at 100% 0%, rgba(201, 111, 88, 0.22), rgba(201, 111, 88, 0) 62%),
          radial-gradient(120% 60% at 0% 100%, rgba(201, 124, 120, 0.16), rgba(201, 124, 120, 0) 64%),
          #1a1412;
        color: #f5ece3;
        --logo-gap: #1a1412;
      }
      .splash__inner { display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 3vmin, 28px); }
      .splash__mark { display: block; width: min(62vw, 46vh, 340px); height: auto; overflow: visible; }
      .splash__word { display: block; width: min(70vw, 52vh, 400px); height: auto; color: inherit; }
      .splash-feathers { stroke: var(--logo-gap); stroke-width: 0.9; stroke-linejoin: round; }
      @media (prefers-reduced-motion: no-preference) {
        .splash__inner { animation: splash-in 520ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
    </style>
